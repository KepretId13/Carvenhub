<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOROSOFT System | Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-nav">
        <div class="menu-btn" onclick="toggleNav()">☰</div>
        <h2 class="logo">KOROSOFT</h2>
    </header>

    <!-- SIDEBAR -->
    <div id="sideNav" class="sidebar">
        <div class="close-btn" onclick="toggleNav()">&times;</div>
        <h2>KOROSOFT</h2>
        <div class="nav-group">
            <a href="#" class="nav-item active">📋 Planner List</a>
            <a href="#" class="nav-item">🎵 OST List</a>
            <a href="#" class="nav-item">🛠️ Dev Tools</a>
        </div>
        <div class="system-ver">v.0.1.0-PF</div>
    </div>

    <div id="navOverlay" class="overlay" onclick="toggleNav()"></div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="header-bar">
            <h1>Planner Collection</h1>
            <div class="search-area">
                <input type="text" id="searchInput" class="search-bar" placeholder="Cari unit atau kode..." onkeyup="filterItems()">
                <select id="difficultyFilter" class="filter-select" onchange="filterItems()">
                    <option value="all">Difficulty</option>
                    <option value="Peaceful">Peaceful</option>
                    <option value="Easy">Easy</option>
                    <option value="Normal">Normal</option>
                </select>
            </div>
        </div>

        <div class="catalog-grid" id="catalog">
            <!-- Unit 1 -->
            <div class="item-card" onclick="openDetail(this)" 
                 data-title="Orange & Dark Red" data-dq="DQ346" data-img="assets/Orange_Dark_Red.webp" 
                 data-vibe="Chill, Focus" data-about="Desain hangat untuk fokus quest harian.">
                <img src="assets/Orange_Dark_Red.webp" class="item-img" loading="lazy">
                <div class="item-info">
                    <div class="item-title">Orange & Dark Red</div>
                    <span class="badge">Easy | DQ346</span>
                </div>
            </div>
            <!-- Tambah unit lain di bawah sini dengan format yang sama -->
        </div>
    </div>

    <!-- MODAL DETAIL -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div class="modal-body">
                <img id="modalImg" src="">
                <div class="modal-text">
                    <h2 id="modalTitle" style="color:#00ffcc;"></h2>
                    <p><strong>Code:</strong> <span id="modalDQ"></span></p>
                    <p><strong>Vibe:</strong> <span id="modalVibe"></span></p>
                    <p id="modalAbout"></p>
                    <a href="https://www.etsy.com" target="_blank" class="btn-buy">GET AT ETSY</a>
                </div>
            </div>
        </div>
    </div>

    <script src="debug.js"></script>
</body>
</html>
