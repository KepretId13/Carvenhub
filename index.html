<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOROSOFT System | Organized Architecture</title>
    <style>
        :root {
            --bg: #0b0b0b;
            --card-bg: #141414;
            --accent: #00ffcc;
            --text: #e0e0e0;
            --text-dim: #888;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            padding: 60px 20px;
            text-align: center;
            border-bottom: 1px solid #222;
        }

        header h1 {
            color: var(--accent);
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Grid System untuk 42 Unit */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid #222;
            border-radius: 8px;
            overflow: hidden;
            transition: 0.3s;
        }

        .item-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
        }

        .item-img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            background: #1a1a1a;
        }

        .item-info {
            padding: 15px;
        }

        .item-title {
            font-size: 0.95em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .item-meta {
            font-size: 0.8em;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
        }

        .badge {
            color: var(--accent);
            font-size: 0.75em;
            text-transform: uppercase;
            border: 1px solid var(--accent);
            padding: 2px 6px;
            border-radius: 4px;
        }

        footer {
            text-align: center;
            padding: 40px;
            font-size: 0.8em;
            color: var(--text-dim);
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

<header>
    <h1>KOROSOFT SYSTEM</h1>
    <p>v.0.0.1 (BETA VARIANT) — Organized Architecture</p>
</header>

<div class="container">
    <div class="catalog-grid">
        
        <!-- Contoh Item 1 -->
    <div class="item-card" onclick="openDetail(this)" 
       data-title="Orange & Dark Red" 
       data-img="assets/Orange_Dark_Red.webp" 
       data-dq="DQ346-298" 
       data-vibe="Chill, Focus, Slow" 
       data-about="Desain dengan latar kastil tua untuk fokus mendalam pada quest mingguan. Cocok buat mode santai tapi tetap progresif.">
    
      <img src="assets/Orange_Dark_Red.webp" alt="Orange Dark Red" class="item-img" loading="lazy">
      <div class="item-info">
        <div class="item-title">Orange_Dark_Red</div>
        <div class="item-meta">
            <span>Easy | DQ346</span>
            <span class="badge">RPG Planner</span>
        </div>
    </div>
</div>

        <!-- Contoh Item 2 -->
    <div class="item-card" onclick="openDetail(this)" 
       data-title="Lime & White" 
       data-img="assets/Lime_White.webp" 
       data-dq="DQ346-298" 
       data-vibe="Chill, Focus, Slow" 
       data-about="Desain dengan latar kastil tua untuk fokus mendalam pada quest mingguan. Cocok buat mode santai tapi tetap progresif.">
    
      <img src="assets/Lime_White.webp" alt="Lime & White" class="item-img" loading="lazy">
      <div class="item-info">
        <div class="item-title">Lime & White</div>
        <div class="item-meta">
            <span>Easy | DQ346</span>
            <span class="badge">RPG Planner</span>
        </div>
    </div>
</div>

        <!-- Tambahkan 39 unit lainnya di sini -->

    </div>
</div>

<footer>
    &copy; 2026 KOROSOFT. Designed for focus and logic.
</footer>
<!-- Detail Modal -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div class="modal-body">
            <img id="modalImg" src="" alt="Preview">
            <div class="modal-text">
                <h2 id="modalTitle"></h2>
                <p><strong>Code:</strong> <span id="modalDQ"></span></p>
                <p><strong>Vibe:</strong> <span id="modalVibe"></span></p>
                <p><strong>About:</strong> <span id="modalAbout"></span></p>
                <br>
                <a href="#" class="badge" style="padding: 10px 20px; text-decoration:none;">BUY ON ETSY</a>
            </div>
        </div>
    </div>
</div>

<style>
    /* Modal Styling */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
    .modal-content { background: #141414; margin: 5% auto; padding: 20px; width: 80%; max-width: 900px; border-radius: 8px; border: 1px solid #333; position: relative; }
    .close { position: absolute; right: 20px; top: 10px; font-size: 30px; cursor: pointer; color: #fff; }
    .modal-body { display: flex; gap: 30px; flex-wrap: wrap; }
    #modalImg { max-width: 400px; width: 100%; border-radius: 4px; border: 1px solid #222; }
    .modal-text { flex: 1; min-width: 300px; }
    .modal-text h2 { color: #00ffcc; margin-top: 0; }
    .modal-text p { color: #ccc; line-height: 1.6; }
</style>
</body>
</html>
