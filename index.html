<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOROSOFT Platform | Suite Edition</title>
    <style>
        :root {
            --sidebar-w: 240px;
            --bg: #0b0b0b;
            --card-bg: #141414;
            --accent: #00ffcc;
            --text: #e0e0e0;
            --text-dim: #888;
        }

        * { box-sizing: border-box; }
        body { display: flex; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; height: 100vh; overflow: hidden; }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-w);
            background: #0f0f0f;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 25px;
            flex-shrink: 0;
        }

        .sidebar h2 { color: var(--accent); font-size: 1.1em; letter-spacing: 3px; margin-bottom: 40px; }
        .nav-group { flex: 1; }
        .nav-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            color: var(--text-dim);
            text-decoration: none;
            display: block;
            font-size: 0.9em;
        }
        .nav-item:hover, .nav-item.active { background: #1a1a1a; color: var(--accent); }

        /* --- MAIN CONTENT --- */
        .main-content { flex: 1; overflow-y: auto; padding: 40px; position: relative; }
        
        .header-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .search-area { display: flex; gap: 10px; }
        .search-bar { background: #1a1a1a; border: 1px solid #333; padding: 10px 20px; border-radius: 6px; color: #fff; width: 250px; }
        .filter-select { background: #1a1a1a; border: 1px solid #333; padding: 10px; border-radius: 6px; color: #fff; }

        /* --- GRID --- */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        .item-card { 
            background: var(--card-bg); 
            border: 1px solid #222; 
            border-radius: 8px; 
            overflow: hidden; 
            cursor: pointer; 
            transition: 0.3s;
        }
        .item-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .item-img { width: 100%; height: auto; display: block; object-fit: contain; background: #000; }
        .item-info { padding: 15px; }
        .item-title { font-size: 0.9em; font-weight: bold; margin-bottom: 5px; }
        .badge { color: var(--accent); font-size: 0.7em; border: 1px solid var(--accent); padding: 2px 6px; border-radius: 4px; }

        /* --- MODAL --- */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); }
        .modal-content { background: #141414; margin: 4% auto; padding: 30px; width: 90%; max-width: 900px; border-radius: 12px; border: 1px solid #333; position: relative; }
        .close { position: absolute; right: 20px; top: 15px; font-size: 28px; cursor: pointer; }
        .modal-body { display: flex; gap: 30px; flex-wrap: wrap; }
        #modalImg { max-width: 380px; width: 100%; height: auto; border-radius: 4px; }
        .modal-text { flex: 1; min-width: 300px; }
        .btn-buy { background: var(--accent); color: #000; padding: 12px 25px; text-decoration: none; border-radius: 4px; font-weight: bold; display: inline-block; margin-top: 20px; }

        footer { margin-top: 50px; color: #444; font-size: 0.8em; border-top: 1px solid #222; padding-top: 20px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>KOROSOFT</h2>
        <div class="nav-group">
            <a href="#" class="nav-item active">📋 Planner List</a>
            <a href="#" class="nav-item">🎵 OST List</a>
            <a href="#" class="nav-item">🛠️ Dev Tools</a>
            <a href="#" class="nav-item">📁 Archives</a>
        </div>
        <div style="font-size: 0.7em; color: #333;">SYSTEM v.0.1.0-PF</div>
    </div>

    <div class="main-content">
        <div class="header-bar">
            <h1 style="margin:0;">Planner Collection</h1>
            <div class="search-area">
                <input type="text" id="searchInput" class="search-bar" placeholder="Cari unit..." onkeyup="filterItems()">
                <select id="difficultyFilter" class="filter-select" onchange="filterItems()">
                    <option value="all">Difficulty</option>
                    <option value="Peaceful">Peaceful</option>
                    <option value="Easy">Easy</option>
                    <option value="Normal">Normal</option>
                </select>
            </div>
        </div>

        <div class="catalog-grid" id="catalog">
            
            <!-- Item 1 -->
            <div class="item-card" onclick="openDetail(this)" 
                 data-title="Orange & Dark Red" 
                 data-img="assets/Orange_Dark_Red.webp" 
                 data-dq="DQ346-298" 
                 data-vibe="Chill, Focus" 
                 data-about="Desain hangat untuk fokus quest harian.">
                <img src="assets/Orange_Dark_Red.webp" class="item-img" loading="lazy">
                <div class="item-info">
                    <div class="item-title">Orange & Dark Red</div>
                    <span class="badge">Easy | DQ346</span>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="item-card" onclick="openDetail(this)" 
                 data-title="Lime & White" 
                 data-img="assets/Lime_White.webp" 
                 data-dq="DQ067-112" 
                 data-vibe="Fresh, Active" 
                 data-about="Warna cerah untuk mood yang lebih produktif.">
                <img src="assets/Lime_White.webp" class="item-img" loading="lazy">
                <div class="item-info">
                    <div class="item-title">Lime & White</div>
                    <span class="badge">Easy | DQ067</span>
                </div>
            </div>

        </div>

        <footer>&copy; 2026 KOROSOFT. Organized Architecture.</footer>
    </div>

    <!-- MODAL -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div class="modal-body">
                <img id="modalImg" src="">
                <div class="modal-text">
                    <h2 id="modalTitle" style="color:var(--accent);"></h2>
                    <p><strong>Code:</strong> <span id="modalDQ"></span></p>
                    <p><strong>Vibe:</strong> <span id="modalVibe"></span></p>
                    <p id="modalAbout" style="line-height:1.6; color:#bbb;"></p>
                    <a href="https://www.etsy.com" target="_blank" class="btn-buy">GET AT ETSY</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openDetail(el) {
            document.getElementById('modalTitle').innerText = el.getAttribute('data-title');
            document.getElementById('modalImg').src = el.getAttribute('data-img');
            document.getElementById('modalDQ').innerText = el.getAttribute('data-dq');
            document.getElementById('modalVibe').innerText = el.getAttribute('data-vibe');
            document.getElementById('modalAbout').innerText = el.getAttribute('data-about');
            document.getElementById('detailModal').style.display = "block";
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = "none";
        }

        function filterItems() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const diff = document.getElementById('difficultyFilter').value;
            const cards = document.getElementsByClassName('item-card');

            for (let card of cards) {
                const title = card.getAttribute('data-title').toLowerCase();
                const content = card.innerText;
                const matchesSearch = title.includes(search);
                const matchesDiff = diff === 'all' || content.includes(diff);
                
                card.style.display = (matchesSearch && matchesDiff) ? "block" : "none";
            }
        }

        window.onclick = (e) => { if (e.target.id === 'detailModal') closeModal(); }
    </script>
</body>
</html>
