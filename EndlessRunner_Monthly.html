<!doctype html>
<html lang="id"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endless Runner</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&amp;display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; margin: 0; overflow: hidden; }
    canvas { display: block; position: absolute; top: 0; left: 0; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/resizing_sdk.js" type="text/javascript"></script>
 </head>
 <body data-template-id="__page-root" class="w-full" style="min-height: calc(100 * min(var(--vh, 1vh), 1vh)); background: rgb(11, 12, 30);">
  <div id="game-wrapper" class="relative w-full" style="height: calc(100 * min(var(--vh, 1vh), 1vh));">
   <canvas id="game"></canvas>
   <div id="score-display" class="absolute top-4 right-6 z-10"><span data-template-id="score-label" class="canva-text text-lg" style="color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 16px;">SKOR</span> <span id="score-value" class="text-2xl font-bold" style="color:#fff; margin-left:8px;">0</span>
   </div>
   <div id="overlay" class="absolute inset-0 flex flex-col items-center justify-center gap-4 z-20" style="background: rgba(11,12,30,0.7);">
    <h1 data-template-id="game-title" class="canva-text text-5xl font-bold drop-shadow-lg" style="color: rgb(0, 210, 211); font-weight: 700; font-style: normal; font-size: 32px;">Endless Runner</h1>
    <p data-template-id="game-instruction" class="canva-text text-xl" style="color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 16px;">Tekan Spasi atau Tap untuk lompat!</p><button data-template-id="start-button" class="canva-button px-8 py-3 rounded-xl text-lg font-bold shadow-lg hover:scale-105 transition-transform" id="start-btn" style="background: rgb(233, 69, 96); color: rgb(255, 255, 255); font-weight: bold; font-style: normal; font-size: 16px;">MULAI</button>
   </div>
   <div id="gameover" class="absolute inset-0 flex flex-col items-center justify-center gap-4 z-20 hidden" style="background: rgba(11,12,30,0.7);">
    <h2 data-template-id="gameover-title" class="canva-text text-4xl font-bold drop-shadow-lg" style="color: rgb(233, 69, 96); font-weight: 700; font-style: normal; font-size: 24px;">GAME OVER</h2>
    <p id="final-score" class="text-2xl font-bold" style="color:#fff;">Score: 0</p><button data-template-id="restart-button" class="canva-button px-8 py-3 rounded-xl text-lg font-bold shadow-lg hover:scale-105 transition-transform" id="restart-btn" style="background: rgb(0, 210, 211); color: rgb(26, 26, 46); font-weight: bold; font-style: normal; font-size: 16px;">MAIN LAGI</button>
   </div>
  </div>
  <script src="/_sdk/editing_sdk.js"></script>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let w, h, ground, player, obstacles, score, speed, gameLoop, isRunning = false;
    const gravity = 0.7, jumpForce = -15;
    let particles = [], stars = [], buildings = [], mountains = [];
    let trees = [], fences = [], birds = [], raindrops = [];
    let frameCount = 0, bgOffset = 0, mtOffset = 0;
    let dayNightCycle = 0, weatherType = 'clear', weatherIntensity = 0;

    function resize() {
      const wrapper = document.getElementById('game-wrapper');
      w = canvas.width = wrapper.clientWidth;
      h = canvas.height = wrapper.clientHeight;
      ground = h - 90;
      initBackground();
    }

    function initBackground() {
      stars = [];
      for (let i = 0; i < 60; i++) stars.push({ x: Math.random() * w, y: Math.random() * ground * 0.6, r: Math.random() * 1.5 + 0.5, twinkle: Math.random() * Math.PI * 2 });
      mountains = [];
      for (let i = 0; i < 8; i++) mountains.push({ x: i * (w / 4), w: w / 3 + Math.random() * 100, h: 80 + Math.random() * 60 });
      buildings = [];
      for (let i = 0; i < 14; i++) buildings.push({ x: i * (w / 7), w: 40 + Math.random() * 50, h: 60 + Math.random() * 100 });
      trees = [];
      for (let i = 0; i < 12; i++) trees.push({ x: i * (w / 6), h: 60 + Math.random() * 40, trunkW: 12, foliageRadius: 25 + Math.random() * 15 });
      fences = [];
      for (let i = 0; i < 16; i++) fences.push({ x: i * (w / 8), h: 35 + Math.random() * 20 });
      birds = [];
      for (let i = 0; i < 5; i++) birds.push({ x: Math.random() * w, y: Math.random() * ground * 0.4 + 20, vx: 2 + Math.random() * 1.5, vy: Math.sin(Math.random() * Math.PI) * 0.5, waveOffset: Math.random() * Math.PI * 2 });
    }

    function reset() {
      player = { x: 80, y: ground, w: 36, h: 52, vy: 0, onGround: true, frame: 0, landTimer: 0 };
      obstacles = [];
      particles = [];
      raindrops = [];
      score = 0;
      speed = 6;
      dayNightCycle = 0;
    }

    function jump() {
      if (player && player.onGround && isRunning) {
        player.vy = jumpForce;
        player.onGround = false;
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.code === 'Space') { e.preventDefault(); jump(); }
    });
    canvas.addEventListener('pointerdown', jump);

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    function spawnObstacle() {
      const type = Math.random() > 0.5 ? 'spike' : 'box';
      const oh = type === 'spike' ? 40 + Math.random() * 30 : 30 + Math.random() * 35;
      const ow = type === 'spike' ? 20 + Math.random() * 10 : 25 + Math.random() * 20;
      obstacles.push({ x: w + 20, y: ground - oh, w: ow, h: oh, type: type });
    }

    function addParticles(x, y) {
      for (let i = 0; i < 6; i++) particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 4, vy: -Math.random() * 3, life: 20 + Math.random() * 10, color: '#00d2d3' });
    }

    function updateDayNightCycle() {
      dayNightCycle += 0.0008;
      if (dayNightCycle >= 1) dayNightCycle = 0;
      if (dayNightCycle < 0.2) weatherType = 'clear';
      else if (dayNightCycle < 0.35) weatherType = 'clouds';
      else if (dayNightCycle < 0.5) { weatherType = 'rain'; weatherIntensity = Math.min(1, (dayNightCycle - 0.35) / 0.15); }
      else if (dayNightCycle < 0.65) { weatherType = 'rain'; weatherIntensity = Math.max(0, 1 - (dayNightCycle - 0.5) / 0.15); }
      else if (dayNightCycle < 0.8) weatherType = 'clear';
      else weatherType = 'stars';
      if (weatherType === 'rain' && Math.random() < weatherIntensity * 0.3) {
        raindrops.push({ x: Math.random() * w, y: -10, vy: 4 + weatherIntensity * 2 });
      }
      for (let i = raindrops.length - 1; i >= 0; i--) {
        raindrops[i].y += raindrops[i].vy;
        if (raindrops[i].y > h) raindrops.splice(i, 1);
      }
    }

    function lerpColor(c1, c2, t) {
      const hex1 = c1.replace('#', ''), hex2 = c2.replace('#', '');
      const r1 = parseInt(hex1.substr(0, 2), 16), g1 = parseInt(hex1.substr(2, 2), 16), b1 = parseInt(hex1.substr(4, 2), 16);
      const r2 = parseInt(hex2.substr(0, 2), 16), g2 = parseInt(hex2.substr(2, 2), 16), b2 = parseInt(hex2.substr(4, 2), 16);
      const r = Math.round(r1 + (r2 - r1) * t), g = Math.round(g1 + (g2 - g1) * t), b = Math.round(b1 + (b2 - b1) * t);
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }

    function getSkyGradient() {
      const time = dayNightCycle;
      if (time < 0.25) {
        return { top: lerpColor('#87ceeb', '#87ceeb', time / 0.25), mid: lerpColor('#e0f6ff', '#87ceeb', time / 0.25), bottom: lerpColor('#fff8dc', '#e0d5b7', time / 0.25) };
      } else if (time < 0.5) {
        const t = (time - 0.25) / 0.25;
        return { top: lerpColor('#87ceeb', '#1a1a3e', t), mid: lerpColor('#87ceeb', '#2a1a4e', t), bottom: lerpColor('#e0d5b7', '#0d0d2b', t) };
      } else if (time < 0.75) {
        const t = (time - 0.5) / 0.25;
        return { top: lerpColor('#1a1a3e', '#0b0c1e', t), mid: lerpColor('#2a1a4e', '#1a1a3e', t), bottom: lerpColor('#0d0d2b', '#16213e', t) };
      } else {
        const t = (time - 0.75) / 0.25;
        return { top: lerpColor('#0b0c1e', '#87ceeb', t), mid: lerpColor('#1a1a3e', '#87ceeb', t), bottom: lerpColor('#16213e', '#fff8dc', t) };
      }
    }

    function getEnvColors() {
      const isDaytime = dayNightCycle < 0.25 || dayNightCycle >= 0.8;
      if (isDaytime) {
        return { mountain: '#4a7ba7', building: '#5a8fbf', window: '#ffd700', ground: '#7cb9e8', grid: '#6aa8d8', accent: '#ffeb3b' };
      }
      return { mountain: '#0d1b3e', building: '#0a1628', window: '#1a3a5c', ground: '#0f3460', grid: '#1a4a7a', accent: '#e94560' };
    }

    function update() {
      player.vy += gravity;
      player.y += player.vy;
      const wasAir = !player.onGround;
      if (player.y >= ground) {
        player.y = ground; player.vy = 0; player.onGround = true;
        if (wasAir) { addParticles(player.x + player.w / 2, ground); player.landTimer = 5; }
      }
      if (player.onGround) player.frame += 0.2;
      if (player.landTimer > 0) player.landTimer--;

      frameCount++;
      if (frameCount % Math.max(35, 75 - Math.floor(score / 4)) === 0) spawnObstacle();

      for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= speed;
        if (obstacles[i].x + obstacles[i].w < 0) { obstacles.splice(i, 1); score++; continue; }
        const o = obstacles[i];
        if (player.x + player.w - 12 > o.x && player.x + 12 < o.x + o.w && player.y > o.y + 5) { gameOver(); return; }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].x += particles[i].vx; particles[i].y += particles[i].vy; particles[i].vy += 0.2; particles[i].life--;
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      for (let b of birds) {
        b.x -= speed * 0.5;
        b.y += Math.sin(frameCount * 0.05 + b.waveOffset) * 0.3;
        if (b.x < -20) b.x = w + 20;
      }

      speed = 6 + score * 0.15;
      bgOffset = (bgOffset + speed * 0.3) % (w / 7);
      mtOffset = (mtOffset + speed * 0.15) % (w / 4);
      updateDayNightCycle();
      document.getElementById('score-value').textContent = score;
    }

    function draw() {
      if (!ctx || w <= 0 || h <= 0) return;

      const skyColors = getSkyGradient();
      const env = getEnvColors();
      const isDaytime = dayNightCycle < 0.25 || dayNightCycle >= 0.8;

      // Sky
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, skyColors.top);
      grad.addColorStop(0.5, skyColors.mid);
      grad.addColorStop(1, skyColors.bottom);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // Stars
      const t = Date.now() * 0.002;
      const starVis = Math.max(0, Math.sin(Math.PI * dayNightCycle - Math.PI * 0.5)) * 0.8;
      for (const s of stars) {
        ctx.globalAlpha = starVis * (0.4 + 0.6 * Math.sin(t + s.twinkle));
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Sun/Moon
      const sunY = ground * 0.3;
      const sunX = w * (0.2 + dayNightCycle * 0.6);
      if (dayNightCycle < 0.5) {
        ctx.globalAlpha = Math.max(0, Math.sin(Math.PI * dayNightCycle / 0.5));
        ctx.fillStyle = dayNightCycle < 0.25 ? '#ffeb3b' : '#ff6b35';
        ctx.beginPath(); ctx.arc(sunX, sunY, 40, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.globalAlpha = Math.max(0, Math.sin(Math.PI * (dayNightCycle - 0.5) / 0.5));
        ctx.fillStyle = '#f0f0f0';
        ctx.beginPath(); ctx.arc(sunX, sunY, 35, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = skyColors.mid;
        ctx.beginPath(); ctx.arc(sunX + 12, sunY - 8, 35, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Mountains
      ctx.fillStyle = env.mountain;
      for (const m of mountains) {
        let mx = m.x - mtOffset;
        if (mx < -m.w) mx += w + m.w;
        ctx.beginPath(); ctx.moveTo(mx, ground); ctx.lineTo(mx + m.w / 2, ground - m.h); ctx.lineTo(mx + m.w, ground); ctx.fill();
      }

      // Buildings
      for (const b of buildings) {
        let bx = b.x - bgOffset;
        if (bx < -b.w) bx += w + b.w * 2;
        ctx.fillStyle = env.building;
        ctx.fillRect(bx, ground - b.h, b.w, b.h);
        ctx.fillStyle = env.window;
        for (let wy = ground - b.h + 8; wy < ground - 10; wy += 16) {
          for (let wx = bx + 6; wx < bx + b.w - 6; wx += 14) ctx.fillRect(wx, wy, 6, 8);
        }
      }

      // Trees
      for (const tr of trees) {
        let tx = tr.x - bgOffset;
        if (tx < -50) tx += w + 100;
        ctx.fillStyle = env.mountain;
        ctx.fillRect(tx, ground - tr.h, tr.trunkW, tr.h);
        ctx.fillStyle = isDaytime ? '#2d8a4d' : '#1a4d2e';
        ctx.beginPath(); ctx.arc(tx + tr.trunkW / 2, ground - tr.h - 5, tr.foliageRadius, 0, Math.PI * 2); ctx.fill();
      }

      // Fences
      const fenceWood = isDaytime ? '#8B4513' : '#3d2817';
      const fenceRail = isDaytime ? '#a0522d' : '#4d2e1a';
      for (const f of fences) {
        let fx = f.x - bgOffset;
        if (fx < -30) fx += w + 60;
        ctx.fillStyle = fenceWood;
        ctx.fillRect(fx, ground - f.h, 4, f.h);
        ctx.fillRect(fx + 20, ground - f.h, 4, f.h);
        ctx.strokeStyle = fenceRail; ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
          const ry = ground - f.h + f.h * (i + 1) / 4;
          ctx.beginPath(); ctx.moveTo(fx, ry); ctx.lineTo(fx + 20, ry); ctx.stroke();
        }
      }

      // Ground
      ctx.fillStyle = env.ground;
      ctx.fillRect(0, ground, w, h - ground);
      const gridSize = 60;
      const gridOff = (bgOffset * 2) % gridSize;
      ctx.strokeStyle = env.grid; ctx.lineWidth = 1;
      for (let i = -gridOff; i < w; i += gridSize) { ctx.beginPath(); ctx.moveTo(i, ground); ctx.lineTo(i, h); ctx.stroke(); }
      for (let i = ground; i < h; i += gridSize) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(w, i); ctx.stroke(); }
      ctx.strokeStyle = env.accent; ctx.lineWidth = 2;
      for (let i = gridSize * 2 - gridOff; i < w; i += gridSize * 2) { ctx.beginPath(); ctx.moveTo(i, ground); ctx.lineTo(i, h); ctx.stroke(); }
      ctx.shadowColor = env.accent; ctx.shadowBlur = 8;
      ctx.fillStyle = env.accent; ctx.fillRect(0, ground, w, 3);
      ctx.shadowBlur = 0;

      // Player
      drawPlayer();

      // Obstacles
      for (const o of obstacles) {
        if (o.type === 'spike') {
          const grd = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
          grd.addColorStop(0, '#ff6b81'); grd.addColorStop(1, '#e94560');
          ctx.fillStyle = grd;
          ctx.beginPath(); ctx.moveTo(o.x + o.w / 2, o.y); ctx.lineTo(o.x + o.w, o.y + o.h); ctx.lineTo(o.x, o.y + o.h); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#c0392b';
          ctx.beginPath(); ctx.moveTo(o.x + o.w / 2, o.y + 10); ctx.lineTo(o.x + o.w - 5, o.y + o.h - 3); ctx.lineTo(o.x + 5, o.y + o.h - 3); ctx.closePath(); ctx.fill();
        } else {
          const grd = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
          grd.addColorStop(0, '#e94560'); grd.addColorStop(1, '#c0392b');
          ctx.fillStyle = grd; ctx.fillRect(o.x, o.y, o.w, o.h);
          ctx.fillStyle = '#ff6b81'; ctx.fillRect(o.x + 3, o.y + 3, o.w - 6, 4);
          ctx.fillStyle = '#8b1a2b'; ctx.fillRect(o.x + 4, o.y + o.h - 8, o.w - 8, 4);
        }
      }

      // Particles
      for (const p of particles) {
        ctx.globalAlpha = p.life / 30; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Rain
      if (weatherType === 'rain' && weatherIntensity > 0) {
        ctx.globalAlpha = weatherIntensity * 0.6; ctx.strokeStyle = '#a8d8ff'; ctx.lineWidth = 2;
        for (const drop of raindrops) { ctx.beginPath(); ctx.moveTo(drop.x, drop.y); ctx.lineTo(drop.x - 1, drop.y + 12); ctx.stroke(); }
        ctx.globalAlpha = 1;
      }

      // Clouds
      if (weatherType === 'clouds' || weatherType === 'rain') {
        ctx.globalAlpha = Math.min(0.5, weatherIntensity + 0.3); ctx.fillStyle = '#d0d0e8';
        for (let i = 0; i < 4; i++) {
          const cx = (i * (w / 3) + bgOffset * 0.5) % w;
          ctx.beginPath();
          ctx.arc(cx, ground * 0.25 + i * 30, 50, 0, Math.PI * 2);
          ctx.arc(cx + 40, ground * 0.25 + i * 30, 60, 0, Math.PI * 2);
          ctx.arc(cx + 80, ground * 0.25 + i * 30, 50, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      // Birds
      ctx.globalAlpha = 0.8;
      const birdColor = isDaytime ? '#333333' : '#666666';
      const wingColor = isDaytime ? '#1a1a1a' : '#444444';
      for (const b of birds) {
        ctx.fillStyle = birdColor;
        ctx.beginPath(); ctx.ellipse(b.x, b.y, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(b.x + 6, b.y - 2, 4, 0, Math.PI * 2); ctx.fill();
        const wf = Math.sin(frameCount * 0.15) * 8;
        ctx.fillStyle = wingColor;
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - 12 + wf, b.y - 6); ctx.lineTo(b.x - 8, b.y + 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Update text colors based on time
      const textColor = isDaytime ? '#000000' : '#ffffff';
      document.getElementById('score-value').style.color = textColor;
      document.getElementById('final-score').style.color = textColor;
    }

    function drawPlayer() {
      const px = player.x, py = player.y - player.h;
      const squashLerp = Math.max(0, 1 - player.landTimer / 5);
      const squash = 0.85 + squashLerp * 0.15;
      const stretch = 1 + squashLerp * 0.15;

      ctx.save();
      ctx.translate(px + player.w / 2, player.y);
      ctx.scale(stretch, squash);
      ctx.translate(-(px + player.w / 2), -player.y);

      const bodyGrd = ctx.createLinearGradient(px, py, px, py + player.h);
      bodyGrd.addColorStop(0, '#00e5e5'); bodyGrd.addColorStop(1, '#008b8b');
      ctx.fillStyle = bodyGrd;
      roundRect(ctx, px + 4, py + 12, player.w - 8, player.h - 12, 6); ctx.fill();

      ctx.fillStyle = '#00d2d3';
      roundRect(ctx, px + 2, py, player.w - 4, 20, 8); ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(px + 12, py + 9, 5, 0, Math.PI * 2); ctx.arc(px + 26, py + 9, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.arc(px + 13, py + 9, 2.5, 0, Math.PI * 2); ctx.arc(px + 27, py + 9, 2.5, 0, Math.PI * 2); ctx.fill();

      const legFrame = Math.sin(player.frame * 0.15 * Math.PI);
      ctx.fillStyle = '#006b6b';
      if (player.onGround) {
        ctx.fillRect(px + 8, player.y - 8 + legFrame * 4, 8, 8);
        ctx.fillRect(px + 20, player.y - 8 - legFrame * 4, 8, 8);
      } else {
        ctx.fillRect(px + 8, player.y - 6, 8, 6);
        ctx.fillRect(px + 20, player.y - 6, 8, 6);
      }

      ctx.fillStyle = '#009999';
      const armSwing = Math.sin(player.frame * 0.15 * Math.PI) * 5;
      ctx.fillRect(px - 2, py + 18 + armSwing, 6, 14);
      ctx.fillRect(px + player.w - 4, py + 18 - armSwing, 6, 14);

      ctx.restore();
    }

    function roundRect(c, x, y, rw, rh, r) {
      c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + rw - r, y);
      c.quadraticCurveTo(x + rw, y, x + rw, y + r); c.lineTo(x + rw, y + rh - r);
      c.quadraticCurveTo(x + rw, y + rh, x + rw - r, y + rh); c.lineTo(x + r, y + rh);
      c.quadraticCurveTo(x, y + rh, x, y + rh - r); c.lineTo(x, y + r);
      c.quadraticCurveTo(x, y, x + r, y); c.closePath();
    }

    function loop() {
      update();
      draw();
      if (isRunning) gameLoop = requestAnimationFrame(loop);
    }

    function startGame() {
      document.getElementById('overlay').classList.add('hidden');
      document.getElementById('gameover').classList.add('hidden');
      resize();
      reset();
      isRunning = true;
      frameCount = 0;
      loop();
    }

    function gameOver() {
      isRunning = false;
      cancelAnimationFrame(gameLoop);
      document.getElementById('final-score').textContent = 'Score: ' + score;
      document.getElementById('gameover').classList.remove('hidden');
    }

    // Initial render
    resize();
    reset();
